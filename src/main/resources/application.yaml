spring:
  application:
    name: BANK-BRANCH-DETAILS
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/banking_data
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver


  main:
    allow-circular-references: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8085/eureka}

management:
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8091